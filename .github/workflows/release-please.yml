name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created == 'true' }}

      - name: Sync marketplace.json
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/sync-marketplace.sh
          if git diff --quiet .claude-plugin/marketplace.json; then
            echo "marketplace.json already in sync"
          else
            BRANCH="chore/sync-marketplace-versions"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add .claude-plugin/marketplace.json
            git commit -m "chore: sync marketplace.json versions"
            git push -u origin "$BRANCH" --force
            gh pr create --title "chore: sync marketplace.json versions" --body "Auto-generated by release workflow." --base main --head "$BRANCH" || echo "PR already exists"
          fi
